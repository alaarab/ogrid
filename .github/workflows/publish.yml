name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.0.24)'
        required: true
        type: string
      dry-run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: false

# Least privilege by default; the publish job widens what it needs.
permissions:
  contents: read

# Never run two releases at once (they would race on the bump commit and tag).
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Inputs reach shell steps only through env, never ${{ }} interpolation
  # inside run: scripts (which would let a crafted input run commands).
  VERSION: ${{ inputs.version }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version (e.g. 2.18.0 or 3.0.0-beta.1)"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be dispatched from main (got $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version sync
        run: bun run check:versions

      - name: Build all packages
        run: bun run build

      - name: Run all tests
        run: bunx turbo test --concurrency=4

      - name: Lint
        run: bun run lint

      - name: Check package compatibility
        run: |
          bun run check:types
          bun run check:exports
          bun run test:react-compat

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify browsers before publishing
        run: |
          bun run test:e2e:matrix
          bun run test:browser-bundle
          bun run test:e2e:docs

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup npm registry auth for publishing
        # npm >= 11.5.1 authenticates with npm Trusted Publishing (GitHub OIDC,
        # `id-token: write` above) when the package has this workflow registered
        # as its trusted publisher, and only falls back to a token otherwise.
        # NPM_TOKEN is therefore optional: once every package has a trusted
        # publisher on npmjs.com, delete the secret. See RELEASING.md.
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version is older than 11.5.1 and cannot use Trusted Publishing"
            exit 1
          fi
          echo "provenance=true" > ~/.npmrc
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "Using NPM_TOKEN as a fallback to Trusted Publishing"
          else
            echo "No NPM_TOKEN: publishing with Trusted Publishing (OIDC) only"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump version
        # Before the build, so dist matches the new version. Also in dry runs,
        # so a dry run validates what would ship rather than the version that
        # is already on the registry.
        run: |
          bun run version:bump "$VERSION"
          # Refresh bun.lock so the release commit doesn't pin stale versions.
          bun install --lockfile-only
          bun run check:versions

      - name: Build all packages
        run: bun run build

      - name: Publish all packages
        if: ${{ !inputs.dry-run }}
        # publish-all derives the dist-tag: prereleases go to "next", never "latest".
        run: bun run publish:all

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: |
          echo "Dry run: validating packages for $VERSION"
          bun run publish:all --dry-run

      - name: Create git tag
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION"
          fi
          git tag "v$VERSION" 2>/dev/null || echo "Tag v$VERSION already exists"
          git push origin HEAD:main
          # Push the tag without --force: if the tag already exists remotely
          # at a different commit, this fails loudly instead of moving a
          # published release marker.
          remote_sha=$(git ls-remote --tags origin "refs/tags/v$VERSION" | cut -f1)
          local_sha=$(git rev-parse "v$VERSION")
          if [ -z "$remote_sha" ]; then
            git push origin "v$VERSION"
          elif [ "$remote_sha" = "$local_sha" ]; then
            echo "Tag v$VERSION already pushed at the same commit"
          else
            echo "::error::Tag v$VERSION exists remotely at $remote_sha (local: $local_sha). Refusing to move a published tag."
            exit 1
          fi

      - name: Run CI and deploy docs for the release commit
        if: ${{ !inputs.dry-run }}
        # Pushes made with GITHUB_TOKEN don't trigger push workflows, so the
        # release commit would otherwise never get CI or a docs deploy.
        # workflow_dispatch is the documented exception.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main
          gh workflow run deploy-docs.yml --ref main
