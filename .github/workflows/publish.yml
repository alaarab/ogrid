name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.0.24)'
        required: true
        type: string
      dry-run:
        description: 'Dry run (skip actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version sync
        run: |
          ROOT_VER=$(node -p "require('./package.json').version")
          echo "Root version: $ROOT_VER"
          for pkg in packages/*/package.json; do
            PKG_VER=$(node -p "require('./$pkg').version")
            PKG_NAME=$(node -p "require('./$pkg').name")
            if [ "$PKG_VER" != "$ROOT_VER" ]; then
              echo "❌ Version mismatch: $PKG_NAME ($PKG_VER) != root ($ROOT_VER)"
              exit 1
            fi
          done
          echo "✅ All versions in sync: $ROOT_VER"

      - name: Build all packages
        run: bun run build

      - name: Run all tests
        run: bunx turbo test --concurrency=4

      - name: Lint
        run: bun run lint

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Setup npm registry auth for publishing
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "provenance=true" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Bump version
        if: ${{ !inputs.dry-run }}
        run: bun run version:bump ${{ inputs.version }}

      - name: Publish all packages
        if: ${{ !inputs.dry-run }}
        run: bun run publish:all

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: |
          echo "🏃 Dry run — skipping publish"
          echo "Would publish version: ${{ inputs.version }}"
          bun run publish:all --dry-run

      - name: Create git tag
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${{ inputs.version }}"
          fi
          git tag "v${{ inputs.version }}" 2>/dev/null || echo "Tag v${{ inputs.version }} already exists"
          git push origin main
          # Push the tag without --force: if the tag already exists remotely
          # at a different commit, this fails loudly instead of moving a
          # published release marker.
          remote_sha=$(git ls-remote --tags origin "refs/tags/v${{ inputs.version }}" | cut -f1)
          local_sha=$(git rev-parse "v${{ inputs.version }}")
          if [ -z "$remote_sha" ]; then
            git push origin "v${{ inputs.version }}"
          elif [ "$remote_sha" = "$local_sha" ]; then
            echo "Tag v${{ inputs.version }} already pushed at the same commit"
          else
            echo "::error::Tag v${{ inputs.version }} exists remotely at $remote_sha (local: $local_sha). Refusing to move a published tag."
            exit 1
          fi
