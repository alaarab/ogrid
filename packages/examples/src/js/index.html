<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OGrid - Vanilla JS Example</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
    }
    p {
      color: var(--ogrid-fg-secondary, #666);
      margin-bottom: 16px;
    }
    code {
      background: var(--ogrid-header-bg, #f4f4f4);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OGrid - Vanilla JS Example</h1>
    <p>
      A fully featured data table powered by <code>@alaarab/ogrid-js</code>.
      Includes sorting, multi-select &amp; text filtering, column chooser, and pagination.
    </p>
    <div id="grid-container"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
